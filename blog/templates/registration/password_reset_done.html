{% extends "blog/base.html" %} 

{% block content %}
<div class="row justify-content-center align-items-center w-100 m-0 mt-4 pt-2">
    <div class="col-12 d-flex justify-content-center">
        
        <div class="card border-0 shadow-sm rounded-4 bg-white p-4 p-md-4 w-100 text-center" style="max-width: 420px;">
            <div class="card-body p-0">
                
                <div class="mb-3">
                    <span class="fs-1">✉️</span>
                    <h2 class="fw-bold text-dark fs-3 mt-2">Correo enviado</h2>
                </div>
                
                <p class="text-muted small mb-4">
                    Hemos enviado las instrucciones a tu correo electrónico para restablecer tu contraseña. Revisa tu bandeja de entrada o spam.
                </p>

                <a href="{% url 'login' %}" class="btn btn-primary w-100 py-2 fw-semibold rounded-pill shadow-sm">
                    Ir al inicio de sesión
                </a>

            </div>
        </div>

    </div>
</div>
{% endblock %}
