{% extends "blog/base.html" %} 

{% block content %}
<style>
    .card form input[type="email"],
    .card form input[type="text"] {
        width: 100% !important;
        display: block !important;
    }
</style>

<div class="row justify-content-center align-items-center w-100 m-0 mt-4 pt-2">
    <div class="col-12 d-flex justify-content-center">
        
        <div class="card border-0 shadow-sm rounded-4 bg-white p-4 p-md-4 w-100" style="max-width: 420px;">
            <div class="card-body p-0">
                
                <div class="text-center mb-3">
                    <h2 class="fw-bold text-dark fs-3 mb-1">🔒 Recuperar Contraseña</h2>
                    <p class="text-muted small">Ingresa tu correo para restablecerla</p>
                </div>
                
                <form method="POST" class="w-100">
                    {% csrf_token %} 
                    
                    {% if form.errors %}
                        <div class="alert alert-danger py-2 small rounded-3 mb-3 text-center w-100" role="alert">
                            Por favor verifica los datos ingresados.
                        </div>
                    {% endif %}
                    
                    <div class="mb-3 text-start w-100">
                        <label for="{{ form.email.id_for_label }}" class="form-label d-block small fw-semibold text-secondary">
                            {{ form.email.label }}
                        </label>
                        <div class="w-100">
                          {{ form.email }}
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold rounded-pill shadow-sm mt-2">
                        Enviar instrucciones
                    </button>

                    <div class="text-center mt-3 pt-3 border-top">
                        <a href="{% url 'login' %}" class="text-decoration-none small text-muted fw-semibold">
                            ← Volver al login
                        </a>
                    </div>
                </form>

            </div>
        </div>

    </div>
</div>
{% endblock %}
